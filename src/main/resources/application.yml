application:
  name: @project.artifactId@
  version: @project.version@
  environment: ${ENVIRONMENT:local}
decorator:
  datasource:
    flexy-pool:
      threshold.connection:
        acquire: 50
        lease: 1000
spring:
  profiles:
    include: workspace
  application:
    name: copilot-backend
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${FLYWAY_DS_URL:${DS_URL}}
    user: ${FLYWAY_DS_USERNAME:}
    password: ${FLYWAY_DS_PASSWORD:}
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: true
    lock-retry-count: 10
    connect-retries: 5
    connect-retries-interval: 5
    baseline-version: 1
  datasource:
    url: ${DS_URL:jdbc:postgresql://localhost:5432/pg_db}
    username: ${DS_USERNAME}
    password: ${DS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DS_MAX_POOL_SIZE:15}
      minimum-idle: ${DS_MIN_IDLE:1}
      idle-timeout: ${DS_IDLE_TIMEOUT:270000}
      keepalive-time: ${DS_KEEPALIVE_TIME:45000}
      max-lifetime: ${DS_MAX_LIFETIME:300000}
      auto-commit: false
  freemarker:
    template-loader-path: classpath:/templates/
    prefer-file-system-access: false
    charset: UTF-8
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: ${HIBERNATE_SHOW_SQL:false}
    open-in-view: false
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL}
    user: ${ACTIVEMQ_USER}
    password: ${ACTIVEMQ_PASSWORD}
    packages:
      trust-all: true
  jms:
    pub-sub-domain: true
    template:
      default-destination: ${JMS_DEFAULT_TOPIC:gaime.webapp}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    protocol: smtp
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 2KB
  ai:
    chat:
      observations:
        log-prompt: ${OB_CHAT_PROMPT:false}
        log-completion: ${OB_CHAT_COMPLETION:false}
        include-error-logging: ${OB_CHAT_ERROR:false}
      client:
        observations:
          log-prompt: ${OB_CHAT_CLIENT_PROMPT:false}
          log-completion: ${OB_CHAT_CLIENT_COMPLETION:false}
      internal:
        api-key: ${OPENAI_API_KEY}
        chat-model: ${INTERNAL_CHAT_MODEL}
        chat-base-url: ${INTERNAL_CHAT_BASE_URL}
        embedding-model: ${INTERNAL_EMBEDDING_MODEL}
        embedding-base-url: ${INTERNAL_EMBEDDING_BASE_URL}
        embedding-dimensions: ${EMBEDDING_DIMENSIONS:1024}
        vision-model: ${VISION_MODEL}
        vision-base-url: ${VISION_BASE_URL}
        reranker-model: ${RERANKER_MODEL}
        reranker-base-url: ${RERANKER_BASE_URL}

    vectorstore:
      observations:
        log-query-response: ${OB_VS_QUERY_RESPONSE:false}
      pgvector:
        dimensions: ${PGVECTOR_DIMENSIONS:1024}
        distance-type: cosine_distance
        max-document-batch-size: 10000
        index-type: hnsw
        table-name: vector_store
        initialize-schema: ${PG_VECTOR_INIT:false}
        schema-name: ${PG_VECTOR_SCHEMA:public}
  mvc:
    async:
      request-timeout: 120000
  # T3 : restauration automatique des ThreadLocal (observation/trace, MDC correlation) dans les opérateurs Reactor.
  reactor:
    context-propagation: auto
  task:
    execution:
      pool:
        core-size: 8
        max-size: 50
        queue-capacity: 100
      thread-name-prefix: async-exec-
embedding-service:
  base-url: ${EMBEDDING_SERVICE_BASE_URL}
  poll-interval: ${EMBEDDING_SERVICE_POLL_INTERVAL:3s}
  retry-delay: ${EMBEDDING_SERVICE_RETRY_DELAY:30s}
  lease: ${EMBEDDING_SERVICE_LEASE:5m}
  batch-size: ${EMBEDDING_SERVICE_BATCH_SIZE:10}
  max-submit-attempts: ${EMBEDDING_SERVICE_MAX_SUBMIT_ATTEMPTS:3}
  job-timeout: ${EMBEDDING_SERVICE_JOB_TIMEOUT:6h}
  request-timeout: ${EMBEDDING_SERVICE_REQUEST_TIMEOUT:60s}
  max-response-size: ${EMBEDDING_SERVICE_MAX_RESPONSE_SIZE:64MB}
# Extraction du texte des pièces jointes : PDF via le pdf-ocr-pipeline (embedding-service.base-url, mode=extract)
# ou l'OCR LLM (engine: llm) ; les images passent toujours par l'OCR LLM.
attachment-ocr:
  engine: ${ATTACHMENT_OCR_ENGINE:pipeline}
  max-pages: ${ATTACHMENT_MAX_PAGES:1000}
  poll-interval: ${ATTACHMENT_OCR_POLL_INTERVAL:5s}
  job-timeout: ${ATTACHMENT_OCR_JOB_TIMEOUT:1h}
identity-check:
  baseUrl: ${IDENTITY_CHECK_BASE_URL:https://api.int.adnovum-vips.ch}
  call-back-url: ${IDENTITY_CHECK_CALL_BACK_URL:http://localhost:4200/tools}
  # Client keystore (mTLS), mounted outside the classpath (e.g. file:/mnt/secrets/identity-check.p12); ignored when empty
  keystore:
    location: ${IDENTITY_CHECK_KEYSTORE_LOCATION:}
    password: ${IDENTITY_CHECK_KEYSTORE_PASSWORD:}
    type: PKCS12
server:
  tomcat:
    max-swallow-size: -1
  servlet:
    context-path: /zia
    register-default-servlet: false
faq:
  search:
    min-result-before-semantic-search: ${FAQ_MIN_RESULT_BEFORE_SEMANTIC_SEARCH:5}
    trigram-matching:
      limit: ${FAQ_TRIGRAM_MATCHING_LIMIT:15}
      threshold: ${FAQ_SEARCH_THRESHOLD:0.4}
    semantic-matching:
      limit: ${FAQ_SEMANTIC_MATCHING_LIMIT:10}
      metric: ${FAQ_SEMANTIC_MATCHING_METRIC:cosine_similarity}
rag:
  retrieving:
    top-k: ${RAG_RETRIEVING_TOP_K:5}
    query-expander:
      enabled: ${RAG_RETRIEVING_QUERY_EXPANDER_ENABLED:true}
      number-of-expansions: ${RAG_RETRIEVING_QUERY_EXPANDER_NUMBER_OF_EXPANSIONS:3}
      include-original: ${RAG_RETRIEVING_QUERY_EXPANDER_INCLUDE_ORIGINAL:true}
    query-compresser:
      enabled: ${RAG_RETRIEVING_QUERY_COMPRESSER_ENABLED:true}
    query-rewriter:
      enabled: ${RAG_RETRIEVING_QUERY_REWRITER_ENABLED:true}
    bm25:
      enabled: ${RAG_RETRIEVING_BM25_ENABLED:false}
      top-k: ${RAG_RETRIEVING_BM25_TOP_K:2}
      text-search-config: ${RAG_RETRIEVING_BM25_TEXT_SEARCH_CONFIG:simple}
  reranking:
    cohere-api-key: ${COHERE_API_KEY:cohere_api_key}
    score-threshold: ${RERANKING_SCORE_THRESHOLD:0.5}
    enabled: ${RERANKING_ENABLED:true}
    truncate-prompt-tokens: ${RERANKING_TRUNCATE_PROMPT_TOKENS:16384}
    top-k: ${RERANKING_TOP_K:5}
  # T2 : moteur de recherche de RAGTool. local (défaut) : pgvector, BM25 et reranker du backend ; zia-rag : service
  # zia-rag (POST /api/v1/retrieval/documents) avec le jeton Blue de l'utilisateur et les réglages rag.retrieving /
  # rag.reranking (top-k, BM25 → HYBRID, reranker, seuil).
  retrieval:
    provider: ${RAG_RETRIEVAL_PROVIDER:local}
    zia-rag:
      base-url: ${ZIA_RAG_BASE_URL:}
      connect-timeout: ${ZIA_RAG_CONNECT_TIMEOUT:2s}
      read-timeout: ${ZIA_RAG_READ_TIMEOUT:20s}
  document-tool:
    max-tool-calls-per-turn: ${RAG_MAX_TOOL_CALLS_PER_TURN:10}
zia:
  llm:
    # B4 : résilience du modèle de chat interne (internalChatModel).
    resilience:
      # Durée maximale d'un appel HTTP au LLM (flux compris), sous spring.mvc.async.request-timeout.
      request-timeout: ${LLM_REQUEST_TIMEOUT:110s}
      first-token-timeout: ${LLM_FIRST_TOKEN_TIMEOUT:30s}
      # Tentatives sur erreur transitoire, uniquement avant le premier token.
      max-attempts: ${LLM_MAX_ATTEMPTS:3}
      initial-backoff: ${LLM_INITIAL_BACKOFF:500ms}
      max-backoff: ${LLM_MAX_BACKOFF:4s}
      circuit-breaker:
        failure-rate-threshold: ${LLM_CB_FAILURE_RATE_THRESHOLD:50}
        sliding-window-size: ${LLM_CB_SLIDING_WINDOW_SIZE:20}
        minimum-number-of-calls: ${LLM_CB_MINIMUM_NUMBER_OF_CALLS:10}
        wait-duration-in-open-state: ${LLM_CB_WAIT_DURATION_IN_OPEN_STATE:30s}
      # Modèle de repli compatible OpenAI, désactivé tant que FALLBACK_CHAT_MODEL ou FALLBACK_CHAT_BASE_URL est vide.
      fallback:
        chat-model: ${FALLBACK_CHAT_MODEL:}
        chat-base-url: ${FALLBACK_CHAT_BASE_URL:}
        api-key: ${FALLBACK_API_KEY:${OPENAI_API_KEY:}}
        reasoning-effort: ${FALLBACK_REASONING_EFFORT:}
    # T3 : prix par million de tokens pour la métrique zia.llm.cost (optionnel ; clé = modèle renvoyé par le serveur).
    # Exemple : models: { "[Qwen/Qwen3-32B]": { input: 0.5, cached-input: 0.1, output: 1.5 } }
    pricing:
      currency: ${LLM_PRICING_CURRENCY:CHF}
  # B2 : mémoire conversationnelle (fenêtre de l'historique envoyé au LLM, résumé des tours anciens).
  memory:
    # Budget estimé (tokens) de l'historique, résumé compris ; au-delà, les tours les plus anciens sont retirés.
    history-token-budget: ${MEMORY_HISTORY_TOKEN_BUDGET:12000}
    # Part du budget conservée en tours complets après un résumé (hystérésis, prefix caching).
    compaction-ratio: ${MEMORY_COMPACTION_RATIO:0.6}
    summary-enabled: ${MEMORY_SUMMARY_ENABLED:true}
  tools:
    approval:
      # Tools dont chaque appel doit être approuvé par l'utilisateur (T1), séparés par des virgules ; aucun par défaut
      # (démo : get_attachment_content).
      required-tools: ${ZIA_TOOLS_APPROVAL_REQUIRED_TOOLS:}
      # Inférieur à spring.mvc.async.request-timeout, qui borne toute la réponse en streaming.
      timeout: ${ZIA_TOOLS_APPROVAL_TIMEOUT:60s}
logging:
  level:
    zas.admin.zec: ${LOG_LEVEL_ZEC:INFO}
    org.springframework.ai: ${LOG_LEVEL_SPRING_AI:INFO}
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: ${LOG_LEVEL_CHAT_CLIENT_ADVISOR:OFF}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:INFO}
    com.vladmihalcea.flexypool: WARN
deepl:
  auth-key: ${DEEPL_API_KEY:deepl_auth_key}
  default-target-lang: 'fr'
zas:
  security:
    blue-token:
      public-key: ${GATEWAY_PUBLIC_KEY}
      header-name: blue
proxy:
  host: ${PROXY_HOST:proxy-bvcol.admin.ch}
  port: ${PROXY_PORT:8080}
  non-proxy-hosts: ${NON_PROXY_HOSTS:localhost,.admin.ch}
  enabled: true
ai:
  agent:
    ii-data-folder: ${II_DATA_FOLDER}

nuxeo:
  url: ${NUXEO_URL}
  username: ${NUXEO_USERNAME}
  password: ${NUXEO_PASSWORD}

feedback:
  mail:
    enabled: ${FEEDBACK_MAIL_ENABLED:false}
    from: ${FEEDBACK_MAIL_FROM:no-reply-local@zas.admin.ch}
    recipients: ${FEEDBACK_MAIL_RECIPIENTS:}
    subject-prefix: ${FEEDBACK_MAIL_SUBJECT_PREFIX:[ZAS Copilot]}
    app-base-url: ${FEEDBACK_MAIL_APP_BASE_URL:http://localhost:4200}
    log-content: ${FEEDBACK_MAIL_LOG_CONTENT:false}

management:
  observations:
    enable:
      default: true
  # T3 : traces OpenTelemetry. Les spans sont toujours créés (traceId/spanId dans les logs) ; l'export OTLP est
  # désactivé par défaut. Langfuse : OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=https://<hôte>/api/public/otel/v1/traces et
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_HEADERS_AUTHORIZATION="Basic <base64(clé publique:clé secrète)>".
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        # Les métriques restent exposées par Prometheus ; export OTLP optionnel.
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: ${HEALTH_DETAILS:never}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /api/public/v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /api/public/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: zas.admin.zec.backend
